# Legacy DNS-cache fallback only; production deploys use scripts/deploy-cloudflare.sh.
# Blueprint auto-sync is disabled; do not restore the former paid services.
services:
  - type: web
    name: pm-web
    runtime: static
    buildCommand: "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @pm/shared build && pnpm --filter @pm/web build"
    staticPublishPath: ./packages/web/dist
    envVars:
      - key: VITE_API_URL
        value: "https://clarify-pm.thnkring.workers.dev"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: sameorigin
